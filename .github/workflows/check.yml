name: Development checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI toolchain
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          test "$version" = $'Xcode 27.2\nBuild version 27B52'
          test "$(uname -m)" = arm64
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK %s\n' "$sdk_version"
          test "$sdk_version" = 27.2
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDKROOT=%s\n' "$sdk_path" >> "$GITHUB_ENV"
      - name: Install check tools
        run: |
          brew install just llvm@21
          llvm_prefix="$(brew --prefix llvm@21)"
          printf 'CLANG_FORMAT=%s/bin/clang-format\n' "$llvm_prefix" >> "$GITHUB_ENV"
      - name: Check
        run: |
          just --version
          just toolchain
          just check
      - name: Probe Vision OCR availability
        if: always()
        continue-on-error: true
        run: |
          echo '== session =='
          launchctl managername || true
          echo '== standalone OCR =='
          cat > /tmp/vision_probe.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import CoreText
          import Foundation
          import Vision

          func run(_ label: String, _ image: CGImage, _ level: VNRequestTextRecognitionLevel) {
            let request = VNRecognizeTextRequest()
            request.recognitionLevel = level
            request.recognitionLanguages = ["en-US"]
            request.usesLanguageCorrection = true
            do {
              try VNImageRequestHandler(cgImage: image, options: [:]).perform([request])
              let detected = request.results?.compactMap { $0.topCandidates(1).first?.string } ?? []
              print("\(label) OK: \(detected)")
            } catch {
              let ns = error as NSError
              print("\(label) FAILED: \(error) domain=\(ns.domain) code=\(ns.code)")
              print("\(label) userInfo: \(ns.userInfo)")
            }
          }

          let width = 320
          let height = 80
          let context = CGContext(
            data: nil, width: width, height: height, bitsPerComponent: 8, bytesPerRow: 0,
            space: CGColorSpaceCreateDeviceRGB(),
            bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue)!
          context.setFillColor(CGColor(gray: 1, alpha: 1))
          context.fill(CGRect(x: 0, y: 0, width: width, height: height))
          let title = NSAttributedString(
            string: "Hello CI",
            attributes: [.font: NSFont.systemFont(ofSize: 40), .foregroundColor: NSColor.black])
          context.textPosition = CGPoint(x: 10, y: 20)
          CTLineDraw(CTLineCreateWithAttributedString(title), context)
          let image = context.makeImage()!
          print("image: \(image.width)x\(image.height) bits=\(image.bitsPerPixel)")
          run("accurate/raw", image, .accurate)
          run("fast/raw", image, .fast)

          // Mirror the popup fixture: resample 3x onto an opaque white canvas before OCR.
          let scaled = 3
          let scaledContext = CGContext(
            data: nil, width: image.width * scaled, height: image.height * scaled,
            bitsPerComponent: 8, bytesPerRow: 0, space: CGColorSpaceCreateDeviceRGB(),
            bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue)!
          scaledContext.setFillColor(CGColor(gray: 1, alpha: 1))
          scaledContext.fill(
            CGRect(x: 0, y: 0, width: image.width * scaled, height: image.height * scaled))
          scaledContext.draw(
            image,
            in: CGRect(x: 0, y: 0, width: image.width * scaled, height: image.height * scaled))
          run("accurate/resampled", scaledContext.makeImage()!, .accurate)

          do {
            let revision = VNRecognizeTextRequest().revision
            let languages = try VNRecognizeTextRequest.supportedRecognitionLanguages(
              for: .accurate, revision: revision)
            print("supported: \(Array(languages.prefix(6))) revision=\(revision)")
          } catch {
            print("supported FAILED: \(error)")
          }
          SWIFT
          xcrun swift /tmp/vision_probe.swift || true
          echo '== swift test without --disable-sandbox =='
          xcrun swift test --scratch-path .build --jobs 2 --filter 'quitIsVisible' 2>&1 | tail -15 || true
          echo '== swift test with --disable-sandbox =='
          xcrun swift test --scratch-path .build --jobs 2 --disable-sandbox --filter 'quitIsVisible' 2>&1 | tail -15 || true
      # This disposable runner may register its built bundle; the local default gate never does.
      - name: Build unsigned app bundles on ephemeral runner
        run: |
          just build-app debug
          just build-app release
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence
          path: |
            .build/test-results-*.xml
            .build/test-events-*.jsonl
            .build/test-dsp-results-*.json
            .build/test-native-*-results-*.json
            .build/native-hal-*/build.log
            .build/native-hal-*/run.log
            .build/native-hal-*/link-map.txt
            .build/native-hal-*/undefined-symbols.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
